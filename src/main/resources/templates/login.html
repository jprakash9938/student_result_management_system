<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments :: head('Login - Result Management System')}"></head>
<body class="login-wrapper">

    <div class="card login-card">
        <div class="login-logo">
            <i class="fas fa-graduation-cap"></i>
            <span>Result Management</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username / Roll Number</label>
                <input type="text" id="username" placeholder="e.g. teacher or CS2026001" required autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 42px;">
                <i class="fas fa-sign-in-alt"></i> Login Securely
            </button>
        </form>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user is already logged in
            try {
                const user = await apiCall('/api/auth/me');
                if (user && user.authenticated) {
                    redirectUser(user.role);
                }
            } catch (e) {
                // Not logged in, stay on page
            }

            const loginForm = document.getElementById('login-form');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                const params = new URLSearchParams();
                params.append('username', username);
                params.append('password', password);

                try {
                    // Send credentials as application/x-www-form-urlencoded
                    const response = await apiCall('/api/auth/login', {
                        method: 'POST',
                        body: params,
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        }
                    });

                    if (response && response.success) {
                        showToast('Login successful! Loading dashboard...', 'success');
                        
                        // Fetch user details to get the role and redirect
                        setTimeout(async () => {
                            const user = await apiCall('/api/auth/me');
                            if (user && user.authenticated) {
                                redirectUser(user.role);
                            }
                        }, 800);
                    }
                } catch (err) {
                    showToast('Invalid credentials or connection error.', 'error');
                }
            });
        });

        function redirectUser(role) {
            if (role === 'ROLE_ADMIN') {
                window.location.href = '/admin-dashboard.html';
            } else if (role === 'ROLE_TEACHER') {
                window.location.href = '/teacher-dashboard.html';
            } else if (role === 'ROLE_STUDENT') {
                window.location.href = '/student-dashboard.html';
            }
        }
    </script>
</body>
</html>
