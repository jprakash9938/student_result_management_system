<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments :: head('Create Teacher - Result Management')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside th:replace="~{fragments :: sidebar('add-teacher')}"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header th:replace="~{fragments :: header('Create Teacher Account', 'Register a new teacher.')}"></header>

            <div class="card" style="max-width: 600px;">
                <form id="teacher-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="e.g. tsmith" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Teacher's full name" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="teacher@school.com" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; height: 42px;">
                        <i class="fas fa-save"></i> Create Teacher
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('teacher-form').addEventListener('submit', handleFormSubmit);
        });

        async function handleFormSubmit(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();

            const payload = { username, password, fullName, email };

            try {
                const result = await apiCall('/api/teachers', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (result) {
                    showToast('New teacher account created successfully.', 'success');
                    document.getElementById('teacher-form').reset();
                }
            } catch (err) {
                // handled by apiCall
            }
        }
    </script>
</body>
</html>
