<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Teacher Dashboard - Result Management')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside th:replace="~{fragments :: sidebar('teacher-dashboard')}"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header th:replace="~{fragments :: header('Teacher Dashboard', 'System overview and administrative controls.')}"></header>

            <!-- Dashboard Stats Grid -->
            <section class="stats-grid">
                <div class="card stat-card">
                    <div class="stat-info">
                        <span class="stat-value" id="stats-students">-</span>
                        <span class="stat-label">Total Students</span>
                    </div>
                    <div class="stat-icon icon-blue">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                </div>

                <div class="card stat-card">
                    <div class="stat-info">
                        <span class="stat-value" id="stats-subjects">-</span>
                        <span class="stat-label">Total Subjects</span>
                    </div>
                    <div class="stat-icon icon-teal">
                        <i class="fas fa-book"></i>
                    </div>
                </div>

                <div class="card stat-card">
                    <div class="stat-info">
                        <span class="stat-value" id="stats-published">-</span>
                        <span class="stat-label">Published Results</span>
                    </div>
                    <div class="stat-icon icon-emerald">
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>

                <div class="card stat-card">
                    <div class="stat-info">
                        <span class="stat-value" id="stats-pending">-</span>
                        <span class="stat-label">Pending (Drafts)</span>
                    </div>
                    <div class="stat-icon icon-amber">
                        <i class="fas fa-hourglass-half"></i>
                    </div>
                </div>
            </section>

            <!-- Welcome & Quick Actions -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
                <div class="card" style="display: flex; flex-direction: column; gap: 1rem;">
                    <h2>Quick Shortcuts</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Perform administrative operations on the student database and grade transcripts.</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem;">
                        <a href="/add-student.html" class="btn btn-secondary" style="justify-content: flex-start;">
                            <i class="fas fa-user-plus text-primary"></i> Add Student
                        </a>
                        <a href="/marks.html" class="btn btn-secondary" style="justify-content: flex-start;">
                            <i class="fas fa-file-signature text-primary"></i> Enter Marks
                        </a>
                        <a href="/upload-excel.html" class="btn btn-secondary" style="justify-content: flex-start;">
                            <i class="fas fa-file-upload text-primary"></i> Excel Import
                        </a>
                        <a href="/results.html" class="btn btn-secondary" style="justify-content: flex-start;">
                            <i class="fas fa-bullhorn text-primary"></i> Review & Publish
                        </a>
                    </div>
                </div>


            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            loadDashboardStats();
        });

        async function loadDashboardStats() {
            try {
                const stats = await apiCall('/api/results/stats');
                if (stats) {
                    // Safe numeric insertion
                    document.getElementById('stats-students').textContent = stats.totalStudents;
                    document.getElementById('stats-subjects').textContent = stats.totalSubjects;
                    document.getElementById('stats-published').textContent = stats.publishedResults;
                    document.getElementById('stats-pending').textContent = stats.pendingResults;
                }
            } catch (err) {
                console.error('Failed to load stats', err);
            }
        }
    </script>
</body>
</html>
